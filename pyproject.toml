[project]
name = "ops-sentinel"
version = "0.2.0"
description = "Monitors a commission receivables tracker (Google Sheets or Excel): reconciliation, ageing, revenue leakage, accrual variance. Includes an MCP server for Claude."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "openpyxl>=3.1", "gspread>=6.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ops-sentinel = "ops_sentinel.cli:main"
ops-sentinel-mcp = "ops_sentinel.server:main"

[tool.setuptools]
packages = ["ops_sentinel"]
