# Runs the checks on the sample tracker every morning at 08:30 IST and saves the report.
name: daily-receivables-report
on:
  schedule:
    - cron: "0 3 * * *"        # 03:00 UTC = 08:30 IST
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m ops_sentinel.cli report --out reports | tee summary.md
      - run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: receivables-report, path: reports/ }
